name: Build and publish poker-runner image

on:
  push:
    branches:
      - main
    paths:
      - "extensions/langgraph-poker/**"
      - "src/plugin-sdk/**"
      - "Dockerfile"
      - ".github/workflows/build-poker-runner.yml"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to registry"
        required: false
        default: "true"
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openclaw-poker-runner

jobs:
  build-and-push:
    name: Build poker-runner image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image_ref: ${{ steps.push.outputs.image_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Step 1: Build the full OpenClaw base image with:
      #   - langgraph-poker extension bundled
      #   - runner-entrypoint.ts compiled to dist/extensions/langgraph-poker/
      - name: Build base image (OpenClaw + poker extension + runner entrypoint)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            OPENCLAW_EXTENSIONS=langgraph-poker
            OPENCLAW_BUILD_RUNNER=1
          tags: openclaw-poker-base:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=openclaw-poker-base
          cache-to: type=gha,mode=max,scope=openclaw-poker-base

      # Step 2: Build the thin runner image that overrides CMD.
      - name: Build runner image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: extensions/langgraph-poker/Dockerfile.runner
          build-args: |
            BASE_IMAGE=openclaw-poker-base:${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image == 'true' }}
          cache-from: type=gha,scope=openclaw-poker-runner
          cache-to: type=gha,mode=max,scope=openclaw-poker-runner

      - name: Capture digest
        id: push
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "### Poker Runner Image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image ref (set as \`AI_RUNNER_IMAGE\` in Railway):**" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE_REF}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
